name: CI
on: [push, pull_request]

jobs:
  build-test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # scoped to the CrownX product surfaces (the legacy enterprise stubs are
      # excluded — they reference packages that aren't part of this build)
      - run: pnpm typecheck:ci
      - run: pnpm test

  smoke:
    name: engine smoke + security
    runs-on: ubuntu-latest
    # boots identity-service + the 11 CrownX engines + gateway and runs the full
    # smoke/security suite end-to-end through the gateway (v1.1.0 #2 — now a
    # blocking gate; proven green on ubuntu in run #11).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-smoke.sh
