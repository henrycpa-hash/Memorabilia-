version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crownx
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api-gateway:
    build: { context: ../.., dockerfile: infra/docker/gateway.Dockerfile }
    env_file: [../../.env.example]
    environment:
      GATEWAY_PORT: 4000
      XP_SERVICE_URL: http://xp-service:4073
      ATTRIBUTION_SERVICE_URL: http://attribution-service:4074
      PASSKEY_SERVICE_URL: http://passkey-service:4075
    ports: ["4000:4000"]
    depends_on:
      - identity-service
      - asset-registry-service
      - authentication-service
      - coa-provenance-service
      - marketplace-service
      - royalty-engine-service
      - referral-service
      - notification-service
      - auction-service
      - offer-service
      - watchlist-service
      - ledger-payout-service
      - growth-ranking-service
      - audit-service
      - settlement-service
      - dispute-service
      - fraud-risk-service
      - campaign-service
      - render-worker-service
      - analytics-warehouse-service
      - automation-orchestrator-service
      - payment-integration-service
      - shipping-logistics-service
      - insurance-claims-service
      - ml-risk-inference-service
      - experimentation-service
      - creator-crm-service
      - reporting-service
      - social-publishing-service
      - partner-integration-service
      - tenancy-service
      - agency-team-service
      - finance-export-service
      - connector-runtime-service
      - model-training-service
      - semantic-metrics-service
      - policy-compliance-service
      - sso-federation-service
      - billing-metering-service
      - erp-gl-connector-service
      - contract-lifecycle-service
      - legal-packet-service
      - policy-sandbox-service
      - federated-analytics-service
      - sla-governance-service
      - collections-dunning-service
      - signature-integration-service
      - revenue-share-service
      - privacy-governance-service
      - data-residency-service
      - legal-systems-connector-service
      - procurement-automation-service
      - sovereign-deployment-service
      - tax-localization-service
      - redlining-negotiation-service
      - revenue-assurance-service
      - privacy-enhancing-compute-service
      - regulatory-filing-service
      - sales-diligence-automation-service
      - xp-service
      - attribution-service
      - passkey-service

  # ---- CrownX revamp services (additive) ----
  xp-service:
    build: { context: ../.., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE_PATH: services/xp-service } }
    env_file: [../../.env.example]
    ports: ["4073:4073"]
  attribution-service:
    build: { context: ../.., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE_PATH: services/attribution-service } }
    env_file: [../../.env.example]
    environment: { XP_SERVICE_URL: http://xp-service:4073, PUBLIC_SHARE_BASE: http://api-gateway:4000 }
    ports: ["4074:4074"]
    depends_on: [xp-service]
  passkey-service:
    build: { context: ../.., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE_PATH: services/passkey-service } }
